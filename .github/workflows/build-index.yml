name: Publish registry index

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'schemas/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-index.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-registry-index
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Build and publish from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # 每次基于最新 main 重建，避免并发合并使旧索引覆盖新分片。
            git fetch origin main
            git checkout -B registry-index origin/main
            pnpm install --frozen-lockfile
            pnpm run sync:npm
            pnpm run verify
            pnpm run build
            if git diff --quiet -- modules/ index.json; then
              echo 'index.json is already up to date'
              exit 0
            fi
            git add -- modules/ index.json
            git commit -m 'chore(registry): sync npm latest and rebuild index'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish attempt ${attempt} failed; rebuilding against latest main"
          done
          echo 'Unable to publish index.json after 3 attempts' >&2
          exit 1
